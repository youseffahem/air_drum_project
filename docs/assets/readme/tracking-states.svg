ap="round"/><path d="M580 355l-5.22 -10.81M580 355l5.22 -10.81" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="600" y="282" font-size="11.5" fill="#8f98b5" text-anchor="start" >gap &gt; g_max or confidence &lt; c_min</text><path d="M250 205Q290 360 480 384" fill="none" stroke="#33407a" stroke-width="2.6" stroke-linecap="round"/><path d="M480 384l-11.37 3.82M480 384l-10.07 -6.53" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="352" y="300" font-size="11.5" fill="#8f98b5" text-anchor="start" >gap &gt; g_max or confidence &lt; c_min</text><path d="M480 420Q190 430 176 205" fill="none" stroke="#33407a" stroke-width="2.6" stroke-linecap="round"/><path d="M176 205l5.88 10.46M176 205l-4.54 11.11" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="214" y="452" font-size="11.5" fill="#8f98b5" text-anchor="start" >fresh observation,</text><text x="214" y="467" font-size="11.5" fill="#8f98b5" text-anchor="start" >confidence &gt;= c_valid</text><path d="M960 205Q940 372 680 392" fill="none" stroke="#33407a" stroke-width="2.6" stroke-linecap="round"/><path d="M680 392l10.37 -6.03M680 392l11.17 4.38" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="910" y="330" font-size="11.5" fill="#8f98b5" text-anchor="start" >treated as INVALID,</text><text x="910" y="345" font-size="11.5" fill="#8f98b5" text-anchor="start" >must re-acquire</text><rect x="100" y="115" width="200" height="90" rx="18" fill="#0f1630" stroke="#6ee05a" stroke-width="2.2" /><text x="200" y="156" font-size="21" fill="#6ee05a" text-anchor="middle" class="bb" letter-spacing="2">VALID</text><text x="200" y="182" font-size="12.5" fill="#8f98b5" text-anchor="middle" >commits allowed</text><rect x="480" y="115" width="200" height="90" rx="18" fill="#0f1630" stroke="#fad250" stroke-width="2.2" /><text x="580" y="156" font-size="21" fill="#fad250" text-anchor="middle" class="bb" letter-spacing="2"