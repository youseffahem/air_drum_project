<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1160" height="580" viewBox="0 0 1160 580" role="img" aria-labelledby="t d">
<title id="t">Per-hand tracking states</title>
<desc id="d">State machine of one hand: VALID, DEGRADED, INVALID and STALE, with the transitions between them. A light token walks through a typical sequence; only VALID commits by default and INVALID or STALE reset the predictor.</desc>
