<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1160" height="676" viewBox="0 0 1160 676" role="img" aria-labelledby="t d">
<title id="t">Space Drums layered architecture</title>
<desc id="d">Ten layers from contracts at the bottom to ablation at the top; a layer may import only from the layers below it. Four import rules are forbidden by contract: prediction to geometry, commit to perception, causal stages to offline labels, and upward imports.</desc>
