# Space Drums — EXAMPLE configuration (Phase 01, Task 01.7).
#
# Purpose: demonstrate every block of configs/schema/config.schema.json and serve as the
# schema-test fixture (tests/contracts/test_config_schema.py, scripts/validate_contracts.py).
#
# EVERY NUMBER IN THIS FILE IS A `# candidate` VALUE. None was measured, tuned, or validated.
# Nothing here is a result. Real configs are created by the owning phases (Phase 02 camera,
# Phase 04 zones/audio, Phase 05 commit, Phase 13 model) and frozen only with evidence.
# Frame-period arithmetic used for candidates: 1/30 s ≈ 0.0333 s (arithmetic, not a measurement).

meta:
  schema_version: "1.2"         # 1.2 (Phase 03, ADR-0014): adds the optional `hands` block below
  created: "2026-09-20"
  phase: "01"
  description: "Schema example only. All values are placeholders/candidates; not a runnable profile."
  supersedes: null
  status: candidate

camera_profile:
  profile_id: example-camera-profile
  device:
    index: 0                    # candidate (Phase 02 enumerates devices)
    name: null
    backend: null               # Pending Benchmark (Phase 02): backend id logged when chosen
  resolution_px: [1280, 720]    # candidate
  requested_fps: 30             # candidate: 30 FPS baseline is the REQUESTED mode (Q23); delivered FPS is measured
  exposure:
    mode: AUTO
    value: null
  timestamp_source: GRAB_RETURN # candidate until Phase 02 Task 02.2 decides
  native_fps_measured: null     # MUST stay null until a Phase 02 run measures it (integrity I-5)
  queue:
    max_frames: 2               # candidate (Phase 02 Task 02.3: 1–2 frames)
    drop_policy: DROP_OLDEST
    stall_factor: 2.0           # candidate

roi:
  px: [160, 40, 960, 640]       # candidate; Phase 02 distance benchmark decides

hands:                          # (schema 1.2, Phase 03 Task 03.1, ADR-0014) hand-landmark estimator; all candidates
  detector: mediapipe-hand-landmarker
  model_asset_id: mediapipe-hand-landmarker-float16-v1   # assets/models/manifest.json (fetch script pins the SHA-256)
  running_mode: VIDEO           # candidate: VIDEO (estimator carries its hand ROI causally) vs IMAGE (per frame)
  num_hands: 2                  # candidate; only LEFT/RIGHT are ever emitted
  min_hand_detection_confidence: 0.5   # candidate (estimator default)
  min_hand_presence_confidence: 0.5    # candidate (estimator default)
  min_tracking_confidence: 0.5         # candidate (estimator default; VIDEO mode only)
  input: ROI                    # the fixed ROI crop is what the estimator sees (Phase 02 ROI policy)
  swap_handedness: false        # DECIDED 2026-09-21 (owner check, HW-01 image not mirrored): estimator label = anatomical hand
  identity:                     # (Task 03.2) LEFT/RIGHT identity assignment; all candidates
    mode: TEMPORAL              # RAW = estimator label only (03.1 baseline); TEMPORAL = label + wrist continuity
    gate_distance: 0.15         # candidate: ROI-normalized wrist displacement per frame accepted as continuity
    max_gap_s: 0.25             # candidate: continuity memory (~7 frames at 30 FPS, arithmetic)
    w_label: 0.5                # candidate: label weight; continuity weight = 1 - w_label
    ambiguity_margin: 0.15      # candidate: best-vs-second assignment margin below which both hands are AMBIGUOUS
    ambiguous_score_cap: 0.5    # candidate: must satisfy tracking.c_min (0.3) <= cap < tracking.c_valid (0.6) -> DEGRADED at most
  grip:                         # (Task 03.3) grip reference point / direction prior; all candidates
    point_weights: { index_mcp: 0.4, thumb_ip: 0.2, thumb_tip: 0.2, middle_mcp: 0.2 }   # candidate fulcrum estimate
    direction: KNUCKLE_ROW      # candidate chosen on dev-capture overlays (alternatives: WRIST_TO_GRIP, INDEX_MCP_TO_PIP)
    min_direction_span: 0.005   # candidate: ROI-normalized; shorter baseline -> no direction prior

stick:                          # (schema 1.2, Phase 03 Tasks 03.4-03.9, ADR-0015) markerless stick pipeline; all candidates
  method_id: GEOM               # live method; MARKER = fallback/benchmark ONLY (logs a warning; REQ-211)
  search_region:
    length_factor: 4.0          # candidate: x hand span forward along the grip direction prior
    width_factor: 1.2           # candidate: x hand span
    back_factor: 0.5            # candidate: x hand span behind the grip point
    min_span_px: 8.0            # candidate
  segment:
    blur_ksize: 3               # candidate
    canny_low: 40.0             # candidate
    canny_high: 120.0           # candidate
    close_ksize: 3              # candidate (dev sweep on exp-5: 3 > 1 for axis-found rate)
    min_component_px: 25        # candidate
    min_elongation: 2.0         # candidate (dev sweep on exp-5: 2.0 > 3.0)
    angle_tol_rad: 0.7          # candidate
    max_components: 4           # candidate
  axis:
    method: RANSAC              # candidate (dev sweep on exp-5: RANSAC >= PCA > HOUGH on axis-found rate)
    grip_tolerance_factor: 0.6  # candidate: x hand span
    inlier_dist_px: 2.0         # candidate: floor of the inlier band
    inlier_dist_factor: 0.3     # candidate: x hand span (both stick edges)
    min_inliers: 20             # candidate
    ransac_iters: 64            # candidate
    seed: 0                     # deterministic per call
    support_gap_factor: 0.5     # candidate: x hand span
    hough_threshold: 15         # candidate (HOUGH only)
    hough_min_len_px: 15.0      # candidate (HOUGH only)
    hough_max_gap_px: 6.0       # candidate (HOUGH only)
  geom:
    l_prior: 0.27               # candidate: ROI-HEIGHT units; Phase 02 d100: 120 px / 440 px (protocol table)
    no_axis_confidence_factor: 0.4   # candidate
    refine_online: false        # pure per-frame estimator (TipEstimator Protocol); true = causal running L
    refine_alpha: 0.05          # candidate
    refine_min_axis_confidence: 0.7  # candidate
    refine_support_range: [0.6, 1.4]  # candidate
  axis_refined:
    max_deviation_factor: 0.35  # candidate: x L
    min_support_factor: 0.5     # candidate: x L
    fallback_confidence_factor: 0.6  # candidate
  marker:                       # FALLBACK / BENCHMARK ONLY; placeholder range for a green band, NOT calibrated
    hsv_low: [35, 80, 80]
    hsv_high: [85, 255, 255]
    min_area_px: 12
    search: SEARCH_REGION
    axis_consistency_px: 12.0
    reference_area_px: 120

zones:                          # MVP set per ADR-0003; positions are candidates (Phase 04/05/14)
  - zone_id: hihat
    name: Hi-Hat
    trigger_type: HAND_TIP
    shape: { type: ELLIPSE, center: [0.20, 0.30], rx: 0.12, ry: 0.06, angle_rad: 0.0 }   # candidate
    impact_surface: { type: ARC, center: [0.20, 0.30], rx: 0.12, ry: 0.06, angle_rad: 0.0, theta_start_rad: 3.141592653589793, theta_end_rad: 6.283185307179586 } # candidate
    inward_normal: [0.0, 1.0]   # +y = downward in the image frame (ADR-0005)
    sample_id: tr505-hihat-closed
    gain_curve_id: default
  - zone_id: snare
    name: Snare
    trigger_type: HAND_TIP
    shape: { type: ELLIPSE, center: [0.40, 0.65], rx: 0.14, ry: 0.08, angle_rad: 0.0 }   # candidate
    impact_surface: { type: ARC, center: [0.40, 0.65], rx: 0.14, ry: 0.08, angle_rad: 0.0, theta_start_rad: 3.141592653589793, theta_end_rad: 6.283185307179586 } # candidate
    inward_normal: [0.0, 1.0]
    sample_id: tr505-snare
    gain_curve_id: default
  - zone_id: tom1
    name: Tom 1
    trigger_type: HAND_TIP
    shape: { type: ELLIPSE, center: [0.55, 0.35], rx: 0.11, ry: 0.06, angle_rad: 0.0 }   # candidate
    impact_surface: { type: ARC, center: [0.55, 0.35], rx: 0.11, ry: 0.06, angle_rad: 0.0, theta_start_rad: 3.141592653589793, theta_end_rad: 6.283185307179586 } # candidate
    inward_normal: [0.0, 1.0]
    sample_id: tr505-tom-h
    gain_curve_id: default
  - zone_id: crash_ride
    name: Crash/Ride
    trigger_type: HAND_TIP
    # allowed_hands omitted on purpose: defaults to [LEFT, RIGHT] (REQ-011, hand-agnostic)
    shape: { type: POLYGON, points: [[0.72, 0.22], [0.95, 0.22], [0.95, 0.40], [0.72, 0.40]] }  # candidate
    impact_surface: { type: SEGMENT, p0: [0.72, 0.22], p1: [0.95, 0.22] }                        # candidate
    inward_normal: [0.0, 1.0]
    sample_id: tr505-crash
    gain_curve_id: default
  # OOS-REF:REQ-207 — a future kick zone would use a reserved trigger_type (e.g. FOOT) added by
  # schema bump + ADR (ADR-0011). It is NOT expressible in schema 1.0 and must not appear here.

tracking:
  tracker_id: example-tracker
  c_valid: 0.6                  # candidate (README §8 c_valid)
  c_min: 0.3                    # candidate (README §8 c_min)
  g_max_frames: 3               # candidate (README §8 g_max)
  age_max_s: 0.5                # candidate (README §8 age_max)
  history_n: 16                 # candidate (README §14 history window N; TEST-CAUSAL-2 window)
  filter:
    type: kalman_cv             # candidate (Task 03.12 synthetic benchmark, ADR-0016); alpha_beta | kalman_cv | kalman_ca
    params:                     # all candidates; validated by spacedrums.tracking.filter
      q: 5.0                    # process noise intensity
      r_base: 0.0001            # measurement variance at confidence 1 (scaled by 1 / confidence)
      c_floor: 0.2              # confidence floor for the noise scaling
      bridge_decay: 0.7         # DEGRADED bridge confidence multiplier per predicted frame (state machine)
      acquire_on_degraded: false  # a DEGRADED-level observation does not re-acquire from INVALID/STALE
      angle_alpha: 0.6          # scalar axis-angle filter
      angle_beta: 0.3
      causal_tolerance: 0.000001  # TEST-CAUSAL-2 declared tolerance (ROI-normalized units)

anticipator:
  type: rule
  anticipator_id: example-rule-anticipator
  K: 6                          # candidate (README §14 prediction steps)
  dt_step_s: 0.0333             # candidate (≈ one 30 FPS frame period; arithmetic)
  rule:
    motion_model: CV            # candidate (Phase 05 Baseline B: CV vs CA)
    params: {}
  model: null                   # only for type: model (Phase 13)
  fallback: null                # reserved for Phase 13 Task 13.4

commit:
  commit_policy_id: example-commit-policy
  tti_commit_s: 0.05            # candidate (τ_commit; swept in Phases 09/18)
  p_commit: 0.5                 # candidate
  n_confirm_frames: 0           # candidate (0 = disabled)
  refractory_zone_s: 0.10       # candidate (r_zone)
  refractory_hand_s: 0.04       # candidate (r_hand)
  allow_degraded_commits: false # default per README §8; enabling is an explicit experiment
  stale_prediction_tolerance_s: 0.02   # candidate
  max_dropped_since_last: 1     # candidate

audio:
  audio_profile_id: example-audio-profile
  device:
    name: null
    host_api: null              # Pending Benchmark (Phase 04)
  sample_rate_hz: 48000         # candidate
  buffer_frames: 128            # candidate (buffer size B; measured latency decides)
  sample_bank:
    path: assets/samples        # created in Phase 04
    manifest: assets/samples/recorded-manifest.json
  gain:
    curves:
      - gain_curve_id: default
        type: LINEAR_CLIPPED    # candidate (Phase 04 Task 04.10)
        proxy_min: 0.5          # candidate; intensity proxy units (ROI-normalized/s), not force
        proxy_max: 4.0          # candidate
        gain_min: 0.2           # candidate
        gain_max: 1.0           # candidate

debug:
  overlay:
    enabled: true
    show_landmarks: true
    show_stick: true
    show_zones: true
    show_track_state: true
    show_prediction: true
    show_candidates: true
    show_commits: true
    show_timing: true
  record_mode:
    enabled: false
    output_dir: data/sessions
    store_crop: FULL

arms:
  active: B
  shadow: [A]
