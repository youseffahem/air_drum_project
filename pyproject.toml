# Space Drums — package metadata and tool configuration.
#
# Phase 01 kept this file to tool configuration only. Phase 02 adds the [project] table and the
# build backend together with the first module code (docs/repo-layout.md section 4). Runtime
# dependencies are pinned in requirements.lock (docs/environment.md); the list below is the loose
# intent for the package itself and mirrors requirements.in.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacedrums"
version = "0.16.0"
description = "Space Drums: causal temporal strike anticipation for webcam air drumming (graduation project)"
readme = "src/spacedrums/README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - graduation project; see repository" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "lightgbm>=4.3",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spacedrums*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "hardware: needs the development webcam (skipped unless SPACEDRUMS_HW_TESTS=1)",
]
# src/ so tests run without installing; tests/contracts keeps its conftest helpers importable and
# tests/data exports the SYNTHETIC session builder the Phase 07 label tests reuse (tests/README.md).
# tests/invariants exports inv_helpers (Phase 17 fixtures shared by the invariants, failure-injection
# and system suites).
pythonpath = ["src", "tests/contracts", "tests/data", "tests/invariants"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
